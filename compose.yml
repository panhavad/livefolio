services:
  livefolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LIVEFOLIO_IMAGE:-livefolio:local}
    container_name: livefolio
    restart: unless-stopped
    ports:
      - "${LIVEFOLIO_PORT:-8080}:80"
    labels:
      com.centurylinklabs.watchtower.enable: "${AUTO_UPDATE:-false}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: livefolio-watchtower
    restart: unless-stopped
    profiles: ["auto-update"]
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "${UPDATE_INTERVAL_SECONDS:-300}"
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
