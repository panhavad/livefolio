name: livefolio

services:
  livefolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: livefolio:local
    container_name: livefolio
    restart: unless-stopped
    # Reaps the browser's child processes.
    init: true
    environment:
      LIVEFOLIO_SNAPSHOT_REFRESH_MINUTES: "${SNAPSHOT_REFRESH_MINUTES:-10}"
    ports:
      - "${LIVEFOLIO_PORT:-8080}:8080"
    volumes:
      # Accounts, sessions, and portfolios live here and survive redeploys.
      - livefolio-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Pulls the checked-out branch and rebuilds/restarts livefolio when it changes.
  updater:
    build: ./deploy/updater
    image: livefolio-updater:local
    container_name: livefolio-updater
    restart: unless-stopped
    profiles: ["auto-update"]
    environment:
      UPDATE_INTERVAL_SECONDS: "${UPDATE_INTERVAL_SECONDS:-60}"
    volumes:
      - ./:/repo
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  livefolio-data:
